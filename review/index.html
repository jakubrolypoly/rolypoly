<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Review</title>
<link rel="icon" href="data:,">
<meta name="description" content="Watch a video from your own computer, add timestamped notes, and copy them.">
<style>
:root{
  --bg:#101114;
  --elev:#171a1f;
  --elev-2:#1e2228;
  --line:#2a3038;
  --line-2:#3a424d;
  --text:#e8eaed;
  --muted:#9aa1aa;
  --faint:#6f7782;
  --accent:#4c8dff;
  --accent-2:#8eb6ff;
  --accent-ink:#071426;
  --danger:#f0a8ad;
  --danger-line:#6b3036;
  --ok:#bfe9cf;
  --ok-bg:#14301f;
  --ok-line:#23573a;
  --shadow:0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  color-scheme:dark;
}
button,textarea{font:inherit;color:inherit}
button{min-height:36px}
button:focus{outline:none}
button:focus-visible,textarea:focus-visible,.chip:focus-visible{
  outline:2px solid var(--accent-2);
  outline-offset:2px;
}
header{
  display:flex;align-items:center;gap:12px;
  min-height:56px;padding:10px 16px;
  border-bottom:1px solid var(--line);
  background:#14171c;
}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px;flex:none}
#fn{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  gap:16px;
  padding:16px;
  height:calc(100% - 56px);
  min-height:0;
}
#left{min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
#stage{
  position:relative;flex:1;min-height:240px;
  background:#07080a;border:1px solid var(--line);border-radius:12px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
#stage.drag{border-color:var(--accent);background:#101820}
#stage.has{overflow:visible}
video{display:none;background:#000}
#stage.has video{display:block;width:100%;height:100%;object-fit:contain}
#stage.has #empty{display:none}
#empty{text-align:center;color:var(--muted);padding:28px 20px;max-width:420px}
#empty b{display:block;color:var(--text);font-size:16px;font-weight:650;margin-bottom:6px}
#empty p{margin:0 0 14px}
#composer{
  background:var(--elev);
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  display:flex;flex-direction:column;gap:10px;
  flex:none;
}
.comp-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}
.chip,.it button.chip{
  font-variant-numeric:tabular-nums;font-weight:650;font-size:12px;line-height:1.4;
  background:#1a2433;color:var(--accent-2);border:1px solid #314864;border-radius:999px;
  padding:3px 8px;min-height:0;
}
#now{font-size:13px;padding:4px 10px}
#pinAttach{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok);
  border-radius:999px;padding:2px 4px 2px 8px;font-size:12px;font-weight:650;
}
#pinAttach svg{display:block;flex:none}
#pinDetach{min-height:26px;padding:2px 8px;border-radius:999px;color:var(--ok)}
#pinDetach:hover{background:#1c4630;color:#fff}
textarea{
  width:100%;resize:vertical;min-height:64px;max-height:180px;
  background:var(--elev-2);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;
}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.comp-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#pinBtn,#add,#pick,#cp{display:inline-flex;align-items:center;justify-content:center;gap:6px}
#add{margin-left:auto}
.keys{margin:0;color:var(--faint);font-size:12px}
button{
  background:var(--elev-2);border:1px solid var(--line-2);border-radius:8px;padding:7px 12px;cursor:pointer;
}
button:hover{background:#2a3038}
button:disabled{opacity:.45;cursor:default}
button.p{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:650}
button.p:hover{background:#5b98ff}
button.s{background:#232830;border-color:#3a424d}
button.s:hover{background:#2c333c}
button.g{background:transparent;border-color:transparent;color:#b7c0cb;min-height:32px;padding:4px 8px}
button.g:hover{background:#2a3038;color:#fff}
button.danger{background:transparent;border-color:var(--danger-line);color:var(--danger)}
button.danger:hover{background:#3a1c20;color:#ffd5d8}
button.icon{
  width:28px;height:28px;min-height:0;padding:0;border-radius:8px;
  display:inline-flex;align-items:center;justify-content:center;
  background:transparent;border-color:transparent;color:#9aa1aa;flex:none;
}
button.icon:hover{background:#2a3038;color:#fff}
button.icon.danger:hover{background:#4a2327;color:#ffd0d3}
#pinBtn.armed{background:var(--accent);border-color:var(--accent);color:#fff}
#pinBtn.armed:hover{background:#5b98ff}
#pinBtn.armed::after{
  content:"On";font-size:11px;font-weight:650;line-height:1;
  background:rgba(255,255,255,.2);border-radius:999px;padding:3px 6px;
}
#right{
  min-width:0;min-height:0;
  background:var(--elev);border:1px solid var(--line);border-radius:12px;
  padding:12px;display:flex;flex-direction:column;gap:10px;
}
.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-head h2,.sv-head{font-size:15px;margin:0;font-weight:650}
#cp{white-space:nowrap}
#list{flex:1;overflow:auto;min-height:0;padding-right:2px}
#right.landing #list,#right.landing .side-foot{display:none}
#right.landing #saved{flex:1;max-height:none}
.muted{color:var(--muted);font-size:13px}
.it{
  background:#12151a;border:1px solid #262b32;border-radius:10px;
  padding:10px;margin-bottom:8px;
}
.it.hot{border-color:var(--accent);background:#152033}
.it .top{display:flex;align-items:center;gap:6px}
.badge{
  width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none;
}
.pinmark{display:block;flex:none}
.it .sp{flex:1;min-width:4px}
.it .txt{white-space:pre-wrap;word-wrap:break-word;margin-top:6px}
.it .acts{margin-top:6px}
.side-foot{display:flex;justify-content:flex-start}
#status{display:none;border-radius:8px;padding:8px 10px;font-size:13px}
#status.show{display:block}
#status.ok{background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--ok)}
#status.err{background:#3a1a1d;border:1px solid var(--danger-line);color:#f3c4c8}
#status.info{background:#1a2333;border:1px solid #2c3c58;color:#c8d8f3}
#status textarea{margin-top:6px;min-height:90px;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
#saved{overflow:auto;max-height:42%}
#saved.hidden{display:none}
.landing-empty{padding:8px 4px 12px}
.landing-empty .lead{margin:0 0 6px;font-size:15px;font-weight:650}
.landing-empty p{margin:0}
.sv{background:#12151a;border:1px solid #262b32;border-radius:10px;padding:10px;margin-top:8px}
.sv .nm{font-weight:650}
.sv .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sv pre{
  white-space:pre-wrap;word-wrap:break-word;margin:8px 0 0;padding:8px;border-radius:8px;
  background:#0c0e12;color:#d5d9df;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;
}
#pinLayer{position:absolute;z-index:3;pointer-events:none}
#pinCatch{position:absolute;inset:0;pointer-events:none}
#pinLayer.arm #pinCatch{pointer-events:auto;touch-action:none;cursor:crosshair}
#pinMarks{position:absolute;inset:0;pointer-events:none;overflow:visible}
.pin{
  position:absolute;min-width:28px;height:28px;padding:0 7px;border-radius:999px;
  transform:translate(-50%,-50%);
  background:var(--accent);color:#fff;border:2px solid #fff;
  box-shadow:0 2px 8px rgba(0,0,0,.45);
  font:700 13px/24px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  text-align:center;cursor:grab;pointer-events:auto;touch-action:none;
  user-select:none;-webkit-user-select:none;z-index:2;
}
.pin:active{cursor:grabbing}
.pin.hot{z-index:3;box-shadow:0 0 0 3px rgba(76,141,255,.55),0 2px 8px rgba(0,0,0,.45)}
.pin.draft{
  width:28px;min-width:28px;padding:0;z-index:4;
  background:#102033;color:#fff;border:2px dashed var(--accent-2);
}
.pin .num{pointer-events:none;display:block;line-height:24px}
.pin .x{
  position:absolute;top:-18px;right:-18px;width:28px;height:28px;min-height:0;
  padding:0;border:0;border-radius:999px;background:transparent;color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  touch-action:none;z-index:5;opacity:0;
}
.pin .x span{
  width:16px;height:16px;border-radius:50%;background:#2a2f36;border:1px solid #d5dbe3;
  font:700 12px/14px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none;
}
.pin:hover .x,.pin:focus-within .x,.pin.hot .x,.pin.draft .x{opacity:1}
.pin .x:hover span,.pin .x:focus-visible span{background:#6b2c33;border-color:#ffd0d3}
@media (hover:none),(pointer:coarse){
  .pin .x{opacity:1}
}
#toast{
  position:fixed;left:50%;bottom:20px;z-index:30;
  transform:translateX(-50%) translateY(8px);
  background:var(--text);color:#14171c;font-weight:650;
  padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .15s ease,transform .15s ease;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hidden{display:none !important}
@media (max-width:860px){
  body{overflow:auto;height:auto}
  html{height:auto}
  main{grid-template-columns:1fr;height:auto}
  #stage{min-height:52vw;max-height:70vh}
  #list{max-height:none;overflow:visible}
  #saved{max-height:none}
  #right{min-height:280px}
}
@media (max-width:560px){
  #add,#pinBtn{flex:1}
  header{flex-wrap:wrap}
}
</style>
</head>
<body>
<header>
  <h1>Review</h1>
  <button type="button" class="s" id="pick" title="Open a video from this computer">Open video</button>
  <div id="fn">No video open</div>
</header>
<main>
  <section id="left">
    <div id="stage">
      <div id="empty">
        <b>Drop a video here</b>
        <p>Or open a file from this computer. Nothing is uploaded.</p>
        <button type="button" class="p" id="pickEmpty">Open video</button>
      </div>
      <video id="v" controls playsinline></video>
      <div id="pinLayer" class="hidden"><div id="pinCatch"></div><div id="pinMarks"></div></div>
    </div>
    <input type="file" id="file" accept="video/*" class="hidden">
    <div id="composer">
      <div class="comp-top">
        <span class="chip" id="now" title="Current time. Space plays or pauses. Left and right arrows step one second. Hold Shift for five seconds. Comma and period step one frame.">00:00:00.0</span>
        <div id="pinAttach" class="hidden">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 1.4a3.2 3.2 0 0 0-3.2 3.2C4.8 7.4 8 13.2 8 13.2s3.2-5.8 3.2-8.6A3.2 3.2 0 0 0 8 1.4zm0 4.4a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>
          <span>Pin attached</span>
          <button type="button" class="g" id="pinDetach" aria-label="Remove attached pin">Remove</button>
        </div>
      </div>
      <textarea id="t" aria-label="Add a note" placeholder="Add a note at 00:00:00.0"></textarea>
      <div class="comp-actions">
        <button type="button" id="pinBtn" aria-pressed="false" aria-keyshortcuts="P" title="Pin a spot (P)">
          <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 1.4a3.2 3.2 0 0 0-3.2 3.2C4.8 7.4 8 13.2 8 13.2s3.2-5.8 3.2-8.6A3.2 3.2 0 0 0 8 1.4zm0 4.4a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>
          <span>Pin a spot</span>
        </button>
        <button type="button" class="p" id="add" aria-keyshortcuts="Enter" title="Add note (Enter)">Add note</button>
      </div>
      <p class="keys" id="hint"></p>
      <p class="keys">Space play or pause · P pin · Enter add note · arrows step</p>
    </div>
    <div id="status" role="status" aria-live="polite"></div>
  </section>
  <aside id="right" aria-label="Notes">
    <div class="side-head">
      <h2 id="sideTitle">Notes</h2>
      <button type="button" class="p" id="cp" title="Copy all notes">Copy all notes</button>
    </div>
    <div id="list"></div>
    <div class="side-foot" id="foot">
      <button type="button" class="danger" id="clr" title="Clear all notes for this video">Clear all</button>
    </div>
    <div id="saved"></div>
  </aside>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var VERSION="1.1.0";
var NS="review_app_v1";
var $=function(id){return document.getElementById(id)};
var v=$("v"),t=$("t"),stage=$("stage");
var FN="",DUR=0,K="",notes=[];
var editing=-1,editRef=null,highlightRef=null;
var pinMode=false,draftPin=null,lastEdited=null,dirty=false,viewKey=null;
var pinSig="*",drag=null,lastPlace=0,blockPlace=0;
var PIN_SVG='<svg class="pinmark" viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M8 1.4a3.2 3.2 0 0 0-3.2 3.2C4.8 7.4 8 13.2 8 13.2s3.2-5.8 3.2-8.6A3.2 3.2 0 0 0 8 1.4zm0 4.4a1.2 1.2 0 1 1 0-2.4 1.2 1.2 0 0 1 0 2.4z"/></svg>';
var EDIT_SVG='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M11.8 1.7a1.5 1.5 0 0 1 2.1 2.1l-.7.7-2.1-2.1.7-.7zM10.4 3.1 2.6 10.9 2 14l3.1-.6 7.8-7.8-2.5-2.5z"/></svg>';
var DEL_SVG='<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M6.1 1.8h3.8l.5 1.3H13v1.4H3V3.1h2.6l.5-1.3zM4.2 5.6h7.6l-.6 8c0 .4-.3.7-.7.7H5.5c-.4 0-.7-.3-.7-.7l-.6-8z"/></svg>';

function lsGet(k,d){try{var x=localStorage.getItem(k);return x===null?d:x}catch(e){return d}}
function lsSet(k,x){try{localStorage.setItem(k,x)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

function fc(s){
  s=Math.max(0,Number(s)||0);
  var tenths=Math.round(s*10),frac=tenths%10,total=Math.floor(tenths/10);
  var secs=total%60,mins=Math.floor(total/60)%60,hours=Math.floor(total/3600);
  function pad(n){return (n<10?"0":"")+n}
  return pad(hours)+":"+pad(mins)+":"+pad(secs)+"."+frac;
}
function oneLine(txt){return String(txt==null?"":txt).replace(/\s+/g," ").trim()}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function normPin(p){
  if(!p||typeof p!=="object")return null;
  if(typeof p.x!=="number"||typeof p.y!=="number")return null;
  if(!isFinite(p.x)||!isFinite(p.y))return null;
  var x=Math.min(1,Math.max(0,p.x)),y=Math.min(1,Math.max(0,p.y));
  return {x:Math.round(x*10000)/10000,y:Math.round(y*10000)/10000};
}
function pinPhrase(n){
  var p=normPin(n&&n.pin);if(!p)return "";
  return " [pin x="+Math.round(p.x*100)+"% y="+Math.round(p.y*100)+"%]";
}
function noteNear(n){
  return !!(n&&FN&&isFinite(v.currentTime)&&Math.abs(v.currentTime-n.s)<=1);
}

function load(file){
  if(!file)return;
  if(file.type&&!/^video\//.test(file.type)&&!/\.(mp4|m4v|mov|webm|mkv|ogv|avi)$/i.test(file.name)){setStatus("err","That file does not look like a video.");return}
  if(v.dataset.u)URL.revokeObjectURL(v.dataset.u);
  var u=URL.createObjectURL(file);v.dataset.u=u;
  FN=file.name;DUR=0;K="";notes=[];editing=-1;editRef=null;highlightRef=null;draftPin=null;lastEdited=null;dirty=false;
  delete t.dataset.s;
  v.src=u;stage.classList.add("has");
  setPinMode(false);
  $("fn").textContent=FN;document.title="Review: "+FN;
  clearStatus();
  pinSig="*";draw();renderSaved();
}
v.addEventListener("loadedmetadata",function(){
  DUR=isFinite(v.duration)?v.duration:0;
  K=NS+":notes:"+FN+"|"+DUR.toFixed(2);
  var rec=readRecord(lsGet(K,null));
  notes=rec.notes;lastEdited=rec.lastEdited;
  if(!notes.length){
    var old=readRecord(lsGet("smooche_review_v1:"+FN,null));
    if(old.notes.length){notes=old.notes;lastEdited=null;dirty=true;writeStore()}
  }
  $("fn").textContent=FN+" · "+fc(DUR);
  pinSig="*";draw();info();renderSaved();
});
function cleanNote(n){
  if(!n||typeof n.s!=="number"||typeof n.txt!=="string"||!isFinite(n.s))return null;
  var o={s:n.s,txt:n.txt};var p=normPin(n.pin);if(p)o.pin=p;return o;
}
function readRecord(x){
  var empty={notes:[],lastEdited:null};
  if(x==null||x==="")return empty;
  try{
    var o=JSON.parse(x);
    if(Array.isArray(o))return {notes:o.map(cleanNote).filter(Boolean),lastEdited:null};
    if(o&&Array.isArray(o.notes))return {notes:o.notes.map(cleanNote).filter(Boolean),lastEdited:(typeof o.lastEdited==="number"&&isFinite(o.lastEdited))?o.lastEdited:null};
  }catch(e){}
  return empty;
}
function openPicker(){$("file").value="";$("file").click()}
$("pick").onclick=openPicker;
$("pickEmpty").onclick=openPicker;
$("file").onchange=function(e){load(e.target.files[0])};
var dragN=0;
document.addEventListener("dragenter",function(e){e.preventDefault();dragN++;stage.classList.add("drag")});
document.addEventListener("dragleave",function(){dragN=Math.max(0,dragN-1);if(!dragN)stage.classList.remove("drag")});
document.addEventListener("dragover",function(e){e.preventDefault()});
document.addEventListener("drop",function(e){e.preventDefault();dragN=0;stage.classList.remove("drag");
  var fl=Array.prototype.slice.call(e.dataTransfer.files).find(function(x){return /^video\//.test(x.type)||/\.(mp4|m4v|mov|webm|mkv|ogv)$/i.test(x.name)});
  if(fl)load(fl);else setStatus("err","Drop a video file to load it.")});

function info(){
  var play=fc(v.currentTime||0);
  $("now").textContent=FN?play:"00:00:00.0";
  var at=t.dataset.s!==undefined?fc(+t.dataset.s):play;
  var ph="Add a note at "+at;
  if(t.placeholder!==ph)t.placeholder=ph;
  var hint="";
  if(FN&&pinMode&&!draftPin)hint="Click or tap the picture to place a pin.";
  else if(draftPin)hint="Drag the pin if you need to move it.";
  else if(FN&&t.dataset.s!==undefined)hint="This note will use the locked time.";
  $("hint").textContent=hint;
  $("pinAttach").classList.toggle("hidden",!draftPin);
  syncHighlight();
  markHot();
  renderPins();
}
v.addEventListener("timeupdate",info);
v.addEventListener("seeked",info);
v.addEventListener("pause",function(){renderPins()});
v.addEventListener("play",function(){renderPins()});
v.addEventListener("loadeddata",function(){pinSig="*";layoutLayer();renderPins()});

function syncHighlight(){
  if(!highlightRef)return;
  if(!isFinite(v.currentTime))return;
  if(Math.abs(v.currentTime-highlightRef.s)<=1)return;
  highlightRef=null;
  pinSig="*";
  renderPins();
}

function writeStore(){
  if(!K)return;
  if(!notes.length){lsDel(K);lastEdited=null;dirty=false;return}
  if(dirty){lastEdited=Date.now();dirty=false}
  var rec={notes:notes};
  if(typeof lastEdited==="number")rec.lastEdited=lastEdited;
  lsSet(K,JSON.stringify(rec));
}
function saveNotes(){dirty=true;writeStore();pinSig="*";draw();renderPins();renderSaved()}
window.addEventListener("beforeunload",writeStore);
window.addEventListener("pagehide",writeStore);

function draw(){
  var L=$("list");L.innerHTML="";
  notes.sort(function(a,b){return a.s-b.s||a.txt.localeCompare(b.txt)});
  if(editRef)editing=notes.indexOf(editRef);
  if(editing<0){editing=-1;editRef=null}
  $("clr").disabled=!notes.length;
  if(!notes.length){
    L.innerHTML='<div class="muted">'+(FN?"No notes yet.":"")+"</div>";
    return;
  }
  notes.forEach(function(n,i){
    var d=document.createElement("div");
    d.className="it"+(noteNear(n)?" hot":"");
    var icon=n.pin?PIN_SVG:"";
    var unpin=n.pin?'<div class="acts"><button type="button" class="g" data-act="unpin" data-i="'+i+'" title="Remove pin">Remove pin</button></div>':"";
    var head='<div class="top"><span class="badge">'+String(i+1)+'</span><button type="button" class="chip" data-s="'+n.s+'" title="Jump to this moment">'+fc(n.s)+'</button>'+icon+'<span class="sp"></span>';
    if(i===editing){
      d.innerHTML=head+'</div><textarea data-edit="'+i+'">'+esc(n.txt)+'</textarea><div class="row comp-actions"><button type="button" class="p" data-act="save" data-i="'+i+'" title="Save (Ctrl+Enter)">Save</button><button type="button" data-act="cancel">Cancel</button><button type="button" class="g" data-act="now" data-i="'+i+'" title="Move this note to the current playback time">Use current time</button></div>'+unpin;
    }else{
      d.innerHTML=head+'<button type="button" class="icon" data-act="edit" data-i="'+i+'" title="Edit note" aria-label="Edit note">'+EDIT_SVG+'</button><button type="button" class="icon danger" data-act="del" data-i="'+i+'" title="Delete note" aria-label="Delete note">'+DEL_SVG+'</button></div><div class="txt">'+esc(n.txt)+"</div>"+unpin;
    }
    L.appendChild(d);
  });
  var ed=L.querySelector("textarea[data-edit]");
  if(ed){ed.focus();ed.setSelectionRange(ed.value.length,ed.value.length);
    ed.onkeydown=function(e){if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();commitEdit(+ed.dataset.edit)}if(e.key==="Escape"){editing=-1;editRef=null;draw()}}}
}
function commitEdit(i){var ed=$("list").querySelector("textarea[data-edit]");var x=ed?ed.value.trim():"";if(x)notes[i].txt=x;editing=-1;editRef=null;saveNotes()}
function noteIndexFromItem(it){
  if(!it)return -1;
  var items=[],ch=$("list").children;
  for(var i=0;i<ch.length;i++) if(ch[i].classList&&ch[i].classList.contains("it")) items.push(ch[i]);
  return items.indexOf(it);
}
function markHot(){
  var ch=$("list").children,n=0;
  for(var i=0;i<ch.length;i++){
    if(!ch[i].classList||!ch[i].classList.contains("it")) continue;
    if(notes[n]) ch[i].classList.toggle("hot",noteNear(notes[n]));
    n++;
  }
}
$("list").onclick=function(e){
  if(e.target.closest("textarea"))return;
  var b=e.target.closest("button");
  if(!b){
    var it=e.target.closest(".it");
    if(!it||!v.src)return;
    var idx=noteIndexFromItem(it);
    if(idx<0||!notes[idx])return;
    highlightRef=notes[idx];
    v.currentTime=notes[idx].s;v.pause();
    markHot();pinSig="*";renderPins();
    return;
  }
  if(b.dataset.s!==undefined){
    var j=noteIndexFromItem(b.closest(".it"));
    if(j>=0)highlightRef=notes[j];
    if(v.src){v.currentTime=+b.dataset.s;v.pause()}
    markHot();pinSig="*";renderPins();
    return;
  }
  var i=+b.dataset.i,a=b.dataset.act;
  if(a==="del"){if(confirm("Delete this note?")){if(highlightRef===notes[i])highlightRef=null;notes.splice(i,1);editing=-1;editRef=null;saveNotes()}}
  else if(a==="edit"){editing=i;editRef=notes[i];draw()}
  else if(a==="cancel"){editing=-1;editRef=null;draw()}
  else if(a==="save"){commitEdit(i)}
  else if(a==="unpin"){
    var ed=$("list").querySelector("textarea[data-edit]");
    if(ed&&+ed.dataset.edit===i&&notes[i])notes[i].txt=ed.value;
    if(notes[i])delete notes[i].pin;
    saveNotes();
  }
  else if(a==="now"){var ed2=$("list").querySelector("textarea[data-edit]");var keep=ed2?ed2.value:notes[i].txt;editRef=notes[i];notes[i].s=+(v.currentTime||0).toFixed(2);notes[i].txt=keep;saveNotes();}
};
function add(){
  var x=t.value.trim();
  if(!x){setStatus("info","Write a note first.");return}
  if(!FN){setStatus("err","Open a video first so the note has a time.");return}
  var s=t.dataset.s!==undefined?+t.dataset.s:v.currentTime;
  var n={s:+(+s||0).toFixed(2),txt:x};
  var p=normPin(draftPin);if(p)n.pin=p;
  notes.push(n);highlightRef=n;
  t.value="";delete t.dataset.s;draftPin=null;
  clearStatus();
  saveNotes();t.blur();info();
}
$("add").onclick=add;
t.onkeydown=function(e){
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();add()}
  if(e.key==="Escape"){draftPin=null;delete t.dataset.s;t.blur();pinSig="*";clearStatus();info()}
};
$("clr").onclick=function(){
  if(!notes.length)return;
  if(!confirm("Delete all notes for this video?"))return;
  notes=[];editing=-1;editRef=null;highlightRef=null;draftPin=null;delete t.dataset.s;
  if(K)lsDel(K);lastEdited=null;dirty=false;pinSig="*";
  draw();renderPins();info();renderSaved();
};

function contentBox(){
  if(!v.src||!v.videoWidth||!v.videoHeight)return null;
  var vr=v.getBoundingClientRect();
  if(!vr.width||!vr.height)return null;
  var sr=stage.getBoundingClientRect();
  var cs=getComputedStyle(stage);
  var bl=parseFloat(cs.borderLeftWidth)||0,bt=parseFloat(cs.borderTopWidth)||0;
  var er=vr.width/vr.height,ar=v.videoWidth/v.videoHeight;
  var cw,ch,ox,oy;
  if(er>ar){ch=vr.height;cw=ch*ar;ox=(vr.width-cw)/2;oy=0}
  else{cw=vr.width;ch=cw/ar;ox=0;oy=(vr.height-ch)/2}
  return {left:vr.left+ox-(sr.left+bl),top:vr.top+oy-(sr.top+bt),width:cw,height:ch,vLeft:vr.left+ox,vTop:vr.top+oy};
}
function pointToPin(e,clamp){
  var b=contentBox();
  if(!b||b.width<=0||b.height<=0)return null;
  var x=(e.clientX-b.vLeft)/b.width,y=(e.clientY-b.vTop)/b.height;
  if(!clamp&&(x<0||y<0||x>1||y>1))return null;
  return normPin({x:x,y:y});
}
function layoutLayer(){
  var layer=$("pinLayer"),b=contentBox();
  if(!b){layer.classList.add("hidden");return}
  layer.classList.remove("hidden");
  layer.style.left=b.left+"px";layer.style.top=b.top+"px";
  layer.style.width=b.width+"px";layer.style.height=b.height+"px";
}
function pinSignature(){
  var parts=[];
  notes.forEach(function(n,i){
    if(!n.pin||!noteNear(n))return;
    parts.push(i+":"+n.pin.x+":"+n.pin.y+":"+(highlightRef===n?"1":"0"));
  });
  if(draftPin)parts.push("d:"+draftPin.x+":"+draftPin.y);
  return parts.join("|");
}
function movePinEl(el,p){el.style.left=(p.x*100)+"%";el.style.top=(p.y*100)+"%";el.dataset.x=String(p.x);el.dataset.y=String(p.y)}
function renderPins(){
  layoutLayer();
  if(drag)return;
  var sig=pinSignature();
  if(sig===pinSig)return;
  pinSig=sig;
  var box=$("pinMarks");box.innerHTML="";
  notes.forEach(function(n,i){
    if(!n.pin||!noteNear(n))return;
    box.appendChild(makePin(n.pin,String(i+1),String(i),highlightRef===n));
  });
  if(draftPin)box.appendChild(makePin(draftPin,"+","draft",true));
}
function removePin(kind){
  blockPlace=Date.now();
  lastPlace=blockPlace;
  drag=null;
  if(kind==="draft"){
    draftPin=null;
    delete t.dataset.s;
  }else if(notes[+kind]&&notes[+kind].pin){
    delete notes[+kind].pin;
    dirty=true;
    writeStore();
  }else return;
  pinSig="*";
  renderPins();
  info();
  if(kind!=="draft"){draw();renderSaved()}
}
function makePin(pin,label,kind,hot){
  var d=document.createElement("div");
  d.className="pin"+(kind==="draft"?" draft":"")+(hot?" hot":"");
  d.dataset.kind=kind;
  d.setAttribute("role","button");
  d.setAttribute("aria-label",kind==="draft"?"Pending pin":"Pin "+label);
  movePinEl(d,pin);
  var num=document.createElement("span");num.className="num";num.textContent=label;d.appendChild(num);
  var x=document.createElement("button");
  x.className="x";x.type="button";
  x.title="Remove pin";
  x.setAttribute("aria-label","Remove pin");
  var glyph=document.createElement("span");
  glyph.setAttribute("aria-hidden","true");
  glyph.textContent="\u00d7";
  x.appendChild(glyph);
  /* Remove on pointerdown. Cancelling that event also drops the click, and the click would otherwise land on the video and place the pin again. */
  function onX(ev){
    ev.stopPropagation();
    ev.preventDefault();
    removePin(kind);
  }
  x.addEventListener("pointerdown",onX,{passive:false});
  x.addEventListener("click",onX);
  d.appendChild(x);
  d.addEventListener("pointerdown",pinDown);
  d.addEventListener("pointermove",pinMove);
  d.addEventListener("pointerup",pinUp);
  d.addEventListener("pointercancel",pinUp);
  return d;
}
function pinDown(e){
  if(e.target.closest&&e.target.closest(".x"))return;
  if(e.button!==undefined&&e.button!==0)return;
  e.preventDefault();e.stopPropagation();
  var el=e.currentTarget;
  try{el.setPointerCapture(e.pointerId)}catch(err){}
  drag={id:e.pointerId,kind:el.dataset.kind,moved:false,el:el,x:e.clientX,y:e.clientY};
  v.pause();
}
function pinMove(e){
  if(!drag||e.pointerId!==drag.id)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&dx*dx+dy*dy<16)return;
  drag.moved=true;
  var p=pointToPin(e,true);if(!p)return;
  if(drag.kind==="draft")draftPin=p;
  else{
    var n=notes[+drag.kind];if(!n)return;
    n.pin=p;dirty=true;writeStore();
  }
  movePinEl(drag.el,p);
  if(drag.kind==="draft")$("hint").textContent="Pin at "+Math.round(p.x*100)+"% across, "+Math.round(p.y*100)+"% down.";
}
function pinUp(e){
  if(!drag||e.pointerId!==drag.id)return;
  var moved=drag.moved,kind=drag.kind;
  drag=null;
  if(!moved&&kind!=="draft"){
    var n=notes[+kind];
    if(n&&v.src){highlightRef=n;v.currentTime=n.s;v.pause();markHot()}
  }
  if(moved&&kind!=="draft")renderSaved();
  pinSig="*";renderPins();info();
}
function placeDraft(e){
  if(!pinMode)return;
  if(Date.now()-blockPlace<700){e.preventDefault();e.stopPropagation();return}
  if(e.target.closest&&e.target.closest(".pin"))return;
  if(e.button!==undefined&&e.button!==0)return;
  var p=pointToPin(e,true);if(!p)return;
  e.preventDefault();e.stopPropagation();
  v.pause();
  draftPin=p;
  t.dataset.s=String(v.currentTime||0);
  lastPlace=Date.now();
  pinSig="*";renderPins();t.focus();info();
}
$("pinCatch").addEventListener("pointerdown",placeDraft,{passive:false});
$("pinCatch").addEventListener("click",function(e){
  if(Date.now()-blockPlace<700||Date.now()-lastPlace<500){e.preventDefault();e.stopPropagation();return}
  placeDraft(e);
});
$("pinDetach").onclick=function(e){e.stopPropagation();removePin("draft")};
function setPinMode(on){
  pinMode=!!on&&!!v.src;
  var b=$("pinBtn");
  b.classList.toggle("armed",pinMode);
  b.setAttribute("aria-pressed",pinMode?"true":"false");
  b.title=pinMode?"Pin mode is on. Click or tap the picture. (P)":"Pin a spot (P)";
  $("pinLayer").classList.toggle("arm",pinMode);
  if(v.src)v.controls=!pinMode;
  info();
}
$("pinBtn").onclick=function(){
  if(!v.src){setStatus("info","Open a video first, then pin a spot on the picture.");return}
  setPinMode(!pinMode);
};
window.addEventListener("resize",function(){layoutLayer()});
if(window.ResizeObserver){
  var ro=new ResizeObserver(function(){layoutLayer()});
  ro.observe(stage);ro.observe(v);
}

function fmtWhen(ms){
  if(typeof ms!=="number"||!isFinite(ms))return "Last edited time not recorded";
  var d=new Date(ms);
  if(isNaN(d.getTime()))return "Last edited time not recorded";
  var months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var h=d.getHours(),m=d.getMinutes(),ap=h>=12?"pm":"am";
  h=h%12;if(h===0)h=12;
  return "Last edited "+d.getDate()+" "+months[d.getMonth()]+" "+d.getFullYear()+", "+h+":"+(m<10?"0":"")+m+" "+ap;
}
function savedSets(){
  var out=[],keys=[];
  try{for(var i=0;i<localStorage.length;i++)keys.push(localStorage.key(i))}catch(e){return out}
  keys.forEach(function(k){
    if(!k||k.indexOf(NS+":notes:")!==0)return;
    var label=k.slice((NS+":notes:").length);
    var pipe=label.lastIndexOf("|");
    var name=pipe>=0?label.slice(0,pipe):label;
    var dur=null;
    if(pipe>=0){var dv=parseFloat(label.slice(pipe+1));if(isFinite(dv))dur=dv}
    var rec=readRecord(lsGet(k,null));
    if(!rec.notes.length)return;
    out.push({key:k,name:name||"Untitled video",dur:dur,lastEdited:rec.lastEdited,notes:rec.notes});
  });
  out.sort(function(a,b){return (b.lastEdited||0)-(a.lastEdited||0)||a.name.localeCompare(b.name)});
  return out;
}
function renderSaved(){
  var box=$("saved");
  var sets=savedSets().filter(function(s){return !FN||s.key!==K});
  box.innerHTML="";
  $("right").classList.toggle("landing",!FN);
  if(!sets.length){
    if(!FN){
      box.classList.remove("hidden");
      box.innerHTML='<div class="landing-empty"><p class="lead">No saved notes yet</p><p class="muted">Open a video, leave notes, and they stay in this browser. Reopen the same file to continue.</p></div>';
    }else box.classList.add("hidden");
    return;
  }
  box.classList.remove("hidden");
  var h2=document.createElement("h2");h2.className="sv-head";h2.textContent="Saved notes";box.appendChild(h2);
  var lead=document.createElement("div");lead.className="muted";
  lead.textContent=FN?"Other videos saved in this browser.":"Saved in this browser only. Reopen a video to keep reviewing it.";
  box.appendChild(lead);
  sets.forEach(function(s){
    var d=document.createElement("div");d.className="sv";
    var nm=document.createElement("div");nm.className="nm";nm.textContent=s.name;
    if(s.dur!=null){var sp=document.createElement("span");sp.className="muted";sp.textContent=" · "+fc(s.dur);nm.appendChild(sp)}
    d.appendChild(nm);
    var meta=document.createElement("div");meta.className="muted";
    meta.textContent=s.notes.length+" "+(s.notes.length===1?"note":"notes")+" · "+fmtWhen(s.lastEdited);
    d.appendChild(meta);
    var hint=document.createElement("div");hint.className="muted";hint.textContent="Reopen this video to continue";d.appendChild(hint);
    var row=document.createElement("div");row.className="row";
    var view=document.createElement("button");view.type="button";view.className="s";
    view.textContent=viewKey===s.key?"Hide notes":"View notes";
    view.onclick=function(){viewKey=viewKey===s.key?null:s.key;renderSaved()};
    var copy=document.createElement("button");copy.type="button";copy.className="s";copy.textContent="Copy notes";
    copy.onclick=function(){
      var text=notesTextFor(s.name,s.dur,s.notes);
      copyText(text).then(function(){toast("Copied!");clearStatus()},
        function(){viewKey=s.key;renderSaved();setStatus("err","Could not copy automatically. Select the text below and copy it.",text)});
    };
    var del=document.createElement("button");del.type="button";del.className="g danger";del.textContent="Delete saved notes";
    del.onclick=function(){
      if(!confirm("Delete saved notes for "+s.name+"?"))return;
      lsDel(s.key);
      if(s.key===K){notes=[];editing=-1;editRef=null;highlightRef=null;draftPin=null;delete t.dataset.s;lastEdited=null;dirty=false;pinSig="*"}
      if(viewKey===s.key)viewKey=null;
      draw();renderPins();info();renderSaved();
    };
    row.appendChild(view);row.appendChild(copy);row.appendChild(del);d.appendChild(row);
    if(viewKey===s.key){var pre=document.createElement("pre");pre.textContent=notesTextFor(s.name,s.dur,s.notes);d.appendChild(pre)}
    box.appendChild(d);
  });
}

function lineFor(n){
  var pin=pinPhrase(n).replace(/^ /,"");
  var text=oneLine(n.txt);
  return fc(n.s)+(pin?" "+pin:"")+(text?" "+text:"");
}
function notesTextFor(name,dur,arr){
  var head=name||"Video";
  if(typeof dur==="number"&&isFinite(dur)) head+=" ("+fc(dur)+")";
  var ordered=arr.slice().sort(function(a,b){return a.s-b.s||String(a.txt).localeCompare(String(b.txt))});
  return head+"\n"+ordered.map(lineFor).join("\n");
}
function notesText(){return notesTextFor(FN,isFinite(DUR)?DUR:null,notes)}
function copyText(s){
  function fallback(){
    try{var ta=document.createElement("textarea");ta.value=s;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="-1000px";document.body.appendChild(ta);ta.select();var ok=document.execCommand("copy");document.body.removeChild(ta);return ok?Promise.resolve():Promise.reject(new Error("copy failed"))}catch(e){return Promise.reject(e)}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(s).catch(fallback)}
  return fallback();
}
$("cp").onclick=function(){
  if(!notes.length){setStatus("info","There are no notes to copy yet.");return}
  var s=notesText();
  copyText(s).then(function(){toast("Copied!");clearStatus()},
    function(){setStatus("err","Could not copy automatically. Select the text below and copy it.",s)});
};
var toastTimer=0;
function toast(msg){
  var el=$("toast");
  el.textContent=msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.classList.remove("show")},1600);
}

function setStatus(kind,msg,manualText){
  var el=$("status");el.className="show "+kind;el.textContent=msg;
  if(manualText){var ta=document.createElement("textarea");ta.readOnly=true;ta.value=manualText;el.appendChild(ta);ta.focus();ta.select()}
}
function clearStatus(){var el=$("status");el.className="";el.textContent=""}

document.addEventListener("keydown",function(e){
  var a=document.activeElement,tag=a&&a.tagName;
  if(tag==="TEXTAREA"||tag==="SELECT"||(tag==="INPUT"&&a.type!=="file"&&a.type!=="radio"))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var k=e.key;
  if(tag==="BUTTON"&&(k===" "||k==="Enter")){
    if(k===" "&&v.src){e.preventDefault();v.paused?v.play():v.pause()}
    return;
  }
  if(!v.src){
    if(k==="p"||k==="P"){e.preventDefault();setStatus("info","Open a video first, then pin a spot on the picture.")}
    else if(k==="Enter"){e.preventDefault();t.focus()}
    return;
  }
  if(k===" "){e.preventDefault();v.paused?v.play():v.pause()}
  else if(k==="Enter"){e.preventDefault();if(t.value.trim())add();else t.focus()}
  else if(k==="c"||k==="C"){e.preventDefault();v.pause();t.dataset.s=v.currentTime;t.focus();info()}
  else if(k==="p"||k==="P"){e.preventDefault();setPinMode(!pinMode)}
  else if(k==="ArrowRight"){e.preventDefault();v.currentTime=Math.min(v.duration||1e9,v.currentTime+(e.shiftKey?5:1))}
  else if(k==="ArrowLeft"){e.preventDefault();v.currentTime=Math.max(0,v.currentTime-(e.shiftKey?5:1))}
  else if(k==="."){v.pause();v.currentTime+=1/24}
  else if(k===","){v.pause();v.currentTime=Math.max(0,v.currentTime-1/24)}
});
document.addEventListener("keyup",function(e){if(e.key===" "&&document.activeElement&&document.activeElement.tagName==="BUTTON"&&v.src)e.preventDefault()});

document.documentElement.setAttribute("data-version",VERSION);
setPinMode(false);draw();renderSaved();
})();
</script>
</body>
